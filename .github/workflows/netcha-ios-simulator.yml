name: Netcha iOS Simulator Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "www/**"
      - ".github/workflows/netcha-ios-simulator.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "www/**"
      - ".github/workflows/netcha-ios-simulator.yml"

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-26
    steps:
      - name: Checkout Netcha iOS
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Audit iOS dependencies
        run: npm audit --audit-level=high

      - name: Generate and sync iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Configure iOS privacy descriptions
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Netcha utilise la caméra pour les photos et les stories." "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription Netcha utilise la caméra pour les photos et les stories." "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Netcha utilise le microphone pour les messages vocaux et les vidéos." "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription Netcha utilise le microphone pour les messages vocaux et les vidéos." "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Netcha accède aux photos pour publier des contenus." "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription Netcha accède aux photos pour publier des contenus." "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string Netcha peut enregistrer les contenus que vous créez." "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription Netcha peut enregistrer les contenus que vous créez." "$PLIST"

      - name: Add and register Netcha app privacy manifest
        run: |
          find node_modules/@capacitor/ios -name PrivacyInfo.xcprivacy -print -quit | grep -q .
          mkdir -p ios/App/App
          cp PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
          gem install xcodeproj --no-document
          ruby - <<'RUBY'
          require 'xcodeproj'
          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |item| item.name == 'App' }
          abort 'App target not found' unless target
          group = project.main_group.find_subpath('App', true)
          file_ref = group.files.find { |item| item.path == 'PrivacyInfo.xcprivacy' }
          file_ref ||= group.new_file('PrivacyInfo.xcprivacy')
          unless target.resources_build_phase.files_references.include?(file_ref)
            target.resources_build_phase.add_file_reference(file_ref)
          end
          project.save
          RUBY
          plutil -lint ios/App/App/PrivacyInfo.xcprivacy
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package simulator app
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'App.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          plutil -lint "$APP_PATH/PrivacyInfo.xcprivacy"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/netcha-ios-simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: netcha-ios-simulator-app
          path: build/netcha-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14

# Workflow trigger verification: this commit launches the simulator build.
